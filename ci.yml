# draft - wip 
# a relire et tester
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Backend/Backend.slnx -c Release
      - run: dotnet run --project Backend/Db.Tests -c Release --no-build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      # todo : add secret dans github actions
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PWD: ${{ secrets.ADMIN_PWD }}
      EMPLOYE_USER: ${{secrets.EMPLOYE_USER}}
      EMPLOYE_PWD: ${{secrets.EMPLOYE_PWD}}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: _tools/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TESTS_External/E2E_Playwright/package-lock.json

      - run: npm ci
        working-directory: TESTS_External/E2E_Playwright
      - run: npx playwright install --with-deps chromium
        working-directory: TESTS_External/E2E_Playwright

      #  see later alligator? je dois verif si mon test FF existe encore en front pour les 99,99
      # - run: npx playwright install --with-deps chromium firefox
      #   working-directory: TESTS_External/E2E_Playwright

      # le CLI se lance depuis la racine (il lit ./docker-compose.yml)
      - run: go build -C _tools -o ../cli ./cmd/cli # a tester si le -c fait un cd clean avant compile
      - run: ./cli -b # attention ca ping internet, faut presque un b2 pour faire build force sans check internet pour git

      - run: npx --yes wait-on -t 300000 http://localhost:5000/swagger/index.html http://localhost:4444

      - run: ./cli -r

      - name: Tests API (Bruno)
        run: |
          npm install -g @usebruno/cli@4.3.0
          bru run --env Invoicika_API --reporter-junit bruno-report.xml
        working-directory: TESTS_External/API_bruno
        continue-on-error: true

      - run: ./cli -r

      - run: npx playwright test --project=chromium-admin --project=chromium-employee --project=chromium
        working-directory: TESTS_External/E2E_Playwright

      - if: failure()
        run: docker compose logs > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            compose.log
            TESTS_External/E2E_Playwright/playwright-report/
            TESTS_External/E2E_Playwright/test-results/