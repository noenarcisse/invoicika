info:
  name: CompterLesClients
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}Customers?pageSize={{customersCount}}"
  params:
    - name: pageSize
      value: "{{customersCount}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Le nombre de clients correspond a la valeur annoncée par l'API", () => {
          const nbCustomers = res.body.items.length
          const nbCustomersAPI = bru.getVar("customersCount")
          
        //   console.log(nbCustomers+" = "+nbCustomersAPI)
          expect(nbCustomersAPI).to.eq(nbCustomers)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
