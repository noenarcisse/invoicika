info:
  name: RecupererUnEmail
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}Customers"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const email = res.body.items[0].email

        bru.setVar("email", email)
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
