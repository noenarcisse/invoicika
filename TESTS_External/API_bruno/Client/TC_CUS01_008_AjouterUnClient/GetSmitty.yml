info:
  name: GetSmitty
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:5000/api/Customers
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200) return;

        const smitties = res.body.items.filter(e => e.name.includes("Smitty"))

        if(smitties.length < 1) return;
        console.log(smitties[0].customerId)

        bru.setVar("smittyId", smitties[0].customerId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
