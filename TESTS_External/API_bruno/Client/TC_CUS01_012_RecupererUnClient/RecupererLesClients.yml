info:
  name: RecupererLesClients
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}Customers/{{customerId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("On récupère le bon client", () => {
          const id = bru.getVar("customerId")
          const customer = res.body
          
          expect(customer.customerId).to.eq(id)
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
