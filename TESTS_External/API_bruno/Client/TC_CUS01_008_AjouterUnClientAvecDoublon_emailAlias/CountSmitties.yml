info:
  name: CountSmitties
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:5000/api/Customers
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Only one Smitty", () => {
          const customers = res.getBody().items
          const smitties = customers.filter(c => c.email === "smit@ty.com")
          console.log(smitties.length)
          expect(smitties.length).to.eq(1)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
