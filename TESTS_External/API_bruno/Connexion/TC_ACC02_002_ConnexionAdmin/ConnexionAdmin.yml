info:
  name: ConnexionAdmin
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}Auth/login"
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "admin"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Validation du JSON de connexion", () => {
          const ConnexionSchema = {
          type : "object",
          required : ["token"],
          properties : {
            token : {
              type : "string"
            }
          }
        }
          expect(res.getBody()).to.have.jsonSchema(ConnexionSchema)
        })

        test("Validation du token d'auth", () => {
          const token = res.body.token
          
          tokenParts = token.split(".")
          
        //   console.log(tokenParts.length)
          expect(tokenParts.length).to.eq(3)
          
          const part2 = JSON.parse(atob(tokenParts[1]))
        //   console.log(part2)
          expect(part2.role).to.eq("Admin")
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
