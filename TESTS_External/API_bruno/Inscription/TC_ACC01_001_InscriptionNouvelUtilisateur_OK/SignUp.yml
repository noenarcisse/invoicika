info:
  name: SignUp
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:5000/api/Auth/signup
  body:
    type: json
    data: |-
      {
        "username": "Smitty",
        "emailAddress": "smitty@werbenjagermanjansen.com",
        "password": "nummero1"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Validation du JSON d'ajout d'un nouvel utilisateur", () => {
          const SignupJsonSchema = {
            type : "object",
            required : ["userId","username","emailAddress","creationDate"],
            properties : {
                  userId : { type : "string" },
                  username : { type: "string" },
                  emailAddress : {
                    type : "string",
                    format : "email"
                  },
                  creationDate : {
                    type : "string",
                    format : "date-time"
                  }
                }
            }
             
             expect(res.getBody()).to.have.jsonSchema(SignupJsonSchema)
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
