info:
  name: GetU
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:5000/api/Users
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200) return;

        const smitties = res.body.filter(e => e.username === "u")
        if(smitties.length < 1) return;

        console.log(smitties[0].userId)

        bru.setVar("uId", smitties[0].userId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
