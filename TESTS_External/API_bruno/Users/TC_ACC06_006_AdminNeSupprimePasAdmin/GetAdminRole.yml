info:
  name: GetAdminRole
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}Roles"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200) return;

        const adminRole = res.body.find(r => r.roleName == "Admin");

        if (adminRole == undefined) {
          console.log("No admin role found")
          return
        }

        bru.setVar("adminRoleId", adminRole.roleId)
        console.log("adminRoleId = " + bru.getVar("adminRoleId"))

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
