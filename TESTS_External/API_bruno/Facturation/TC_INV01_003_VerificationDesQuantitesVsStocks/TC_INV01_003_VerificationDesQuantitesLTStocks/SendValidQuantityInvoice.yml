info:
  name: SendValidQuantityInvoice
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiUrl}}CustomerInvoices/"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { v4: uuidv4 } = require('uuid');

        const data = bru.getVar("invoice")

        console.log(data)

        console.log(data.customerInvoiceId)
        data.customerInvoiceId = uuidv4()
        console.log(data.customerInvoiceId)
        data.customerInvoiceLines[0].invoiceLineId = uuidv4()

        const item = bru.getVar("item")

        console.log(item)

        data.customerInvoiceLines[0].quantity = item.quantity-1

        req.setHeader("Content-type", "application/json")
        req.setBody(data)
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
