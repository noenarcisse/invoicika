info:
  name: GetCustomersDefaultPage
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}Customers"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200) return;

        // Memes parametres que le frontend : pas de pageNumber/pageSize => defaut 10
        bru.setVar("customersTotalCount", res.body.totalCount)
        bru.setVar("page1CustomerIds", JSON.stringify(res.body.items.map(c => c.customerId)))
        console.log("totalCount = " + res.body.totalCount + ", page1 items = " + res.body.items.length)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
