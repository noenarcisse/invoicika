info:
  name: GetAllCustomers
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}Customers?pageSize=500"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200) return;

        const page1Ids = JSON.parse(bru.getVar("page1CustomerIds") || "[]");

        // Tous les clients, pour reproduire la resolution id -> nom du frontend
        bru.setVar("allCustomers", JSON.stringify(res.body.items))

        // Un client qui n'est PAS dans la premiere page de 10
        const farCustomer = res.body.items.find(c => !page1Ids.includes(c.customerId));
        if (farCustomer) {
          bru.setVar("farCustomerId", farCustomer.customerId)
          bru.setVar("farCustomerName", farCustomer.name)
          console.log("farCustomer = " + farCustomer.name + " (" + farCustomer.customerId + ")")
        } else {
          console.log("Tous les clients sont dans la premiere page")
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
