info:
  name: AddTVA
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiUrl}}vat"
  body:
    type: json
    data: |-
      {
        "percentage": 10
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
