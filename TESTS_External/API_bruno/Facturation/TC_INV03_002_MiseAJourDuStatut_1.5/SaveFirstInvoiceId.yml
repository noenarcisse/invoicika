info:
  name: SaveFirstInvoiceId
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:5000/api/CustomerInvoices/
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status == 200){
          const body = res.body
          
          if (body.length < 0) return
          
          customerInvoiceId = body[0].customerInvoiceId
          bru.setVar("invoiceId", customerInvoiceId)
          
          console.log(customerInvoiceId)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
