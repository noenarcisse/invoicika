http:
  method: POST
  url: http://localhost:5000/api/Auth/login
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "admin"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status == 200){
          const body = res.body
          if (Object.keys(body).includes("token")) {
              console.log("token key found")
              bru.setVar("jwt",res.body.token)
          }
        }

        console.log(bru.getVar("jwt")?? "Pas de token dans 'jwt'")

        if(bru.getVar("jwt")){
          const jwt = bru.getVar("jwt")
          const splet = jwt.split(".")
          mid = atob(splet[1])
          console.log(mid)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
