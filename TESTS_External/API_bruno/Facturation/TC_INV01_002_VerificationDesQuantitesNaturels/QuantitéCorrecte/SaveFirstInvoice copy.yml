info:
  name: SaveFirstInvoice copy
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:5000/api/CustomerInvoices/
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status == 200){
          const body = res.body
          
          if (body.length < 0) return
          
          const customerInvoice = body[0]
          bru.setVar("invoice", customerInvoice)
          
          console.log(bru.getVar("invoice"))
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
