info:
  name: SendInjectedItemValues
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiUrl}}CustomerInvoices/"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { v4: uuidv4 } = require('uuid');

        const data = bru.getVar("invoice")

        console.log(data)

        data.customerInvoiceId = uuidv4()
        data.customerInvoiceLines[0].invoiceLineId = uuidv4()
        data.customerInvoiceLines[0].itemName = "<b>Salut</b>"
        data.customerInvoiceLines[0].itemDescription = "<b>Salut2</b>"

        data.customerInvoiceLines[0].customerInvoice_id = "b9480dc9-126c-4f36-b659-4f73727ca0d7"

        req.setHeader("Content-type", "application/json")
        req.setBody(data)

        //en cas d'erreur d'id, le serveur envoie 500 au lieu de 409
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Il semblerait que certaines propriétés des DTO ne servent à rien

  itemName

  itemDescription

  customerInvoice_id 
