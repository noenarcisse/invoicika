name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - "Backend/**"
      - "Frontend/**"
      - "TESTS_External/**"
      - "docker-compose.yml"
      - "_tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, test-qa]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 #v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Backend/Backend.slnx -c Release
      - run: >
          dotnet run --project Backend/Db.Tests -c Release --no-build
          -- -result-html db-tests.html -result-junit db-tests.xml
      # - run: dotnet run --project Backend/WebAPI.Tests -c Release --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        if: ${{ !cancelled() }}
        with:
          name: backend-report
          if-no-files-found: warn
          retention-days: 7
          path: |
            **/db-tests.html
            **/db-tests.xml

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PWD: ${{ secrets.ADMIN_PWD }}
      EMPLOYE_USER: ${{secrets.EMPLOYE_USER}}
      EMPLOYE_PWD: ${{secrets.EMPLOYE_PWD}}

      TOOLS_REPO: ${{ github.repository }}
      TOOLS_TAG: CLI_1.0.0
      DATASETS_DIR: ${{ github.workspace }}/datasets


    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

    - name: Récupérer les datasets
      run: |
        curl -fsSL -o datasets.tar.gz \
          "https://github.com/$TOOLS_REPO/releases/download/$TOOLS_TAG/datasets.tar.gz"
        tar -xzf datasets.tar.gz

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff #v5
      with:
        go-version-file: _tools/go.mod

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: TESTS_External/E2E_Playwright/package-lock.json

    - run: npm ci
      working-directory: TESTS_External/E2E_Playwright
    - run: npx playwright install --with-deps chromium
      working-directory: TESTS_External/E2E_Playwright

    # - run: go build -C _tools -o ../injectdb ./cmd/injectdb
    - run: go build -C _tools -o ../cli ./cmd/cli
    - run: ./cli -b # attention ca ping internet, faut presque un -bf pour faire build force sans check internet pour git

    - name: Attendre l'API et le front
      run: |
        for i in $(seq 1 40); do
          api=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/swagger/index.html || true)
          front=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4444 || true)
          echo "tentative $i : api=$api front=$front"
          if [ "$api" = "200" ] && [ "$front" = "200" ]; then exit 0; fi
          sleep 5
        done
        docker compose ps -a
        exit 1

    - run: ./cli -r

    - name: Tests API (Bruno)
      run: |
        npm install -g @usebruno/cli@4.3.0
        bru run --env Invoicika_API --reporter-html bruno-report.html --reporter-junit bruno-report.xml 
      working-directory: TESTS_External/API_bruno
      continue-on-error: true

    - run: ./cli -r

    - run: npx playwright test --project=chromium-admin --project=chromium-employee --project=chromium
      working-directory: TESTS_External/E2E_Playwright

    - if: failure()
      run: docker compose logs > compose.log
    - if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
      with:
        name: e2e-debug
        path: |
          compose.log
          **/db-tests.html
          **/db-tests.xml
          TESTS_External/API_bruno/bruno-report.xml
          TESTS_External/API_bruno/bruno-report.html
          TESTS_External/E2E_Playwright/playwright-report/
          TESTS_External/E2E_Playwright/test-results/