name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - run: npm ci --ignore-scripts
        working-directory: Frontend

        # le scanner .net prend tres mal les autres lang ... go semble pas reagir, TS doit etre forcé
      - run: dotnet tool restore

      - name: Begin
        run: >
          dotnet sonarscanner begin
          /k:"noenarcisse_invoicika"
          /o:"noenarcisse"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.projectBaseDir="${{ github.workspace }}"
          /d:sonar.sources="."
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**"
          /d:sonar.typescript.tsconfigPaths="Frontend/tsconfig.json"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - run: dotnet build Backend/Backend.slnx -c Release

      - name: End
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}