sonar.organization=noenarcisse
sonar.projectKey=noenarcisse_invoicika

# prod
sonar.sources=Backend,Frontend/src

# tests
sonar.tests=Frontend/src,TESTS_External/E2E_Playwright
sonar.test.inclusions=\
  Frontend/src/**/*.spec.ts,\
  TESTS_External/E2E_Playwright/**/*.spec.ts

# Hors analyse totale (artefacts générés, dépendances)
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/node_modules/**,\
  **/playwright-report/**,\
  **/test-results/**

# Hors calcul de couverture uniquement
sonar.coverage.exclusions=\
  _tools/**,\
  **/Migrations/**,\
  **/Program.cs